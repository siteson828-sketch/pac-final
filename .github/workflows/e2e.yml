name: E2E

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "pages/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch: {}

jobs:
  checkout-flow:
    name: Checkout flow (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # This is an INTEGRATION test: it renders the real gallery, so it needs a
      # Neon connection. Add DATABASE_URL under
      #   Settings → Secrets and variables → Actions → New repository secret
      # (the read query is harmless; orders are mocked, so nothing is written).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # next dev (started by playwright.config.js webServer) needs these; the
      # secret is optional — the config defaults NEXTAUTH_SECRET to a test value.
      NEXTAUTH_URL: http://localhost:3939
      NEXTAUTH_SECRET: test-e2e-secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Fail early if DATABASE_URL secret is missing
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add a Neon connection string under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
